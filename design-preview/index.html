<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Houdini Agent · UI Refactor — Design Directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Manrope:wght@300;400;500;600;700;800&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@300;400;500;600;700&family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   BASE / SHELL
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:#0a0a0c;color:#e6e6ea;
  font-family:"Outfit","Noto Sans SC",sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overflow:hidden;
}
:root{ --shell-fg:#9a9aa6; --shell-line:rgba(255,255,255,.08); }

/* top bar of the preview shell */
.shell-top{
  position:fixed;top:0;left:0;right:0;height:54px;z-index:60;
  display:flex;align-items:center;gap:16px;padding:0 22px;
  background:linear-gradient(180deg,rgba(10,10,12,.92),rgba(10,10,12,.55));
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--shell-line);
}
.shell-top .mk{font-family:"Sora",sans-serif;font-weight:600;letter-spacing:-.02em;font-size:14px;color:#fff}
.shell-top .mk b{color:#ff7a3c}
.shell-top .sub{font-size:12px;color:var(--shell-fg);letter-spacing:.02em}
.shell-top .grow{flex:1}
.shell-top .counter{font-family:"JetBrains Mono",monospace;font-size:12px;color:#cfcfd6;letter-spacing:.05em}
.shell-top .counter em{color:#ff7a3c;font-style:normal}

/* stage holds the pages */
.stage{position:fixed;inset:54px 0 86px 0;overflow:hidden}
.page{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  gap:54px;padding:38px 48px;opacity:0;pointer-events:none;
  transition:opacity .5s ease;
}
.page.active{opacity:1;pointer-events:auto;z-index:2}

/* caption column */
.cap{width:300px;flex-shrink:0;align-self:center;animation:capIn .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes capIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.cap .pgno{font-family:"JetBrains Mono",monospace;font-size:13px;letter-spacing:.32em;color:var(--shell-fg);margin-bottom:22px}
.cap .pgno b{color:#fff}
.cap h2{font-family:"Fraunces",serif;font-weight:400;font-size:40px;line-height:1.05;letter-spacing:-.02em;color:#fff;margin-bottom:6px}
.cap .zh{font-family:"Noto Serif SC",serif;font-size:15px;color:#b9b9c2;margin-bottom:20px;letter-spacing:.04em}
.cap .phil{font-size:14px;line-height:1.7;color:#8d8d98;margin-bottom:22px;max-width:280px}
.cap .tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:22px}
.cap .tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#a6a6b0;border:1px solid var(--shell-line);border-radius:100px;padding:4px 11px}
.cap .sw{display:flex;gap:8px}
.cap .sw i{width:26px;height:26px;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}

/* phone/panel frame */
.frame{
  flex-shrink:0;width:420px;height:760px;max-height:84vh;border-radius:30px;
  position:relative;overflow:hidden;
  box-shadow:0 50px 110px -30px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.06);
  animation:frameIn .8s cubic-bezier(.2,.7,.2,1) both;
}
@keyframes frameIn{from{opacity:0;transform:translateY(26px) scale(.985)}to{opacity:1;transform:none}}

/* pager */
.pager{
  position:fixed;left:0;right:0;bottom:0;height:86px;z-index:60;
  display:flex;align-items:center;justify-content:center;gap:6px;
  background:linear-gradient(0deg,rgba(10,10,12,.95),rgba(10,10,12,.4));
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--shell-line);
}
.pager .nav{
  width:38px;height:38px;border-radius:11px;border:1px solid var(--shell-line);
  background:rgba(255,255,255,.03);color:#cfcfd6;cursor:pointer;font-size:15px;
  display:grid;place-items:center;transition:.2s;
}
.pager .nav:hover{background:rgba(255,255,255,.09);color:#fff}
.dots{display:flex;gap:5px;margin:0 14px}
.dot{
  min-width:34px;height:34px;padding:0 6px;border-radius:10px;border:1px solid transparent;
  background:transparent;color:var(--shell-fg);cursor:pointer;
  font-family:"JetBrains Mono",monospace;font-size:12px;transition:.22s;
}
.dot:hover{color:#fff;background:rgba(255,255,255,.06)}
.dot.on{color:#0a0a0c;background:#fff;font-weight:600}
.pager .nm{font-family:"Sora",sans-serif;font-size:12px;color:var(--shell-fg);margin-left:14px;min-width:130px}
.pager .nm b{color:#fff}

/* ============================================================
   PANEL  (theme-agnostic structure, styled via CSS variables)
   ============================================================ */
.panel{
  width:100%;height:100%;display:flex;flex-direction:column;
  background:var(--bg);color:var(--text);
  font-family:var(--font-body);font-size:13.5px;position:relative;
}
.panel *::-webkit-scrollbar{width:7px;height:7px}
.panel *::-webkit-scrollbar-thumb{background:var(--scroll,rgba(140,140,160,.3));border-radius:10px}
.panel *::-webkit-scrollbar-track{background:transparent}

/* header */
.hd{
  display:flex;align-items:center;gap:9px;padding:13px 15px;
  border-bottom:1px solid var(--border);background:var(--hd-bg,transparent);
  flex-wrap:wrap;
}
.hd-brand{display:flex;align-items:center;gap:8px;margin-right:auto}
.hd-brand .logo{
  width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
  background:var(--accent-soft);color:var(--accent);font-size:14px;
}
.hd-brand .title{font-family:var(--font-display);font-weight:600;font-size:14.5px;letter-spacing:-.01em;color:var(--text-bright)}
.chip{
  display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 11px;
  border-radius:var(--chip-r,8px);border:1px solid var(--border);
  background:var(--surface);color:var(--text);font-size:12px;font-family:var(--font-body);
  cursor:pointer;transition:.2s;letter-spacing:.01em;
}
.chip:hover{border-color:var(--accent);color:var(--text-bright)}
.chip i{font-style:normal;font-size:9px;opacity:.6}
.chip.model{color:var(--accent);border-color:var(--accent-line,var(--border))}
.toggle{
  height:28px;padding:0 12px;border-radius:var(--chip-r,8px);font-size:12px;cursor:pointer;
  border:1px solid var(--border);background:transparent;color:var(--text-dim);transition:.2s;
}
.toggle.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line,transparent)}
.icon-btn{
  width:28px;height:28px;border-radius:var(--chip-r,8px);border:1px solid transparent;
  background:transparent;color:var(--text-dim);cursor:pointer;font-size:15px;transition:.2s;
}
.icon-btn:hover{background:var(--surface);color:var(--text)}

/* context bar */
.ctxbar{
  display:flex;align-items:center;gap:8px;padding:7px 16px;font-size:11.5px;
  color:var(--text-mute);border-bottom:1px solid var(--border);background:var(--ctx-bg,transparent);
}
.ctxbar .ctx-path{color:var(--accent);font-family:var(--font-mono);font-size:11px}
.ctxbar .ctx-refresh{margin-left:auto;background:none;border:none;color:var(--text-mute);cursor:pointer;font-size:13px}

/* thread */
.thread{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:18px;background:var(--thread-bg,transparent)}

/* messages */
.msg.user{display:flex;justify-content:flex-end}
.msg.user .bubble{
  max-width:86%;padding:11px 14px;border-radius:var(--user-r,14px) var(--user-r,14px) 4px var(--user-r,14px);
  background:var(--user-bg);color:var(--user-fg);border:1px solid var(--user-border,transparent);
  line-height:1.55;font-size:13.5px;box-shadow:var(--user-shadow,none);
}
.msg.ai{display:flex;gap:12px}
.msg.ai .rail{width:2px;border-radius:2px;background:var(--rail);flex-shrink:0;align-self:stretch;opacity:var(--rail-op,1)}
.ai-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}

/* thinking */
.think{border:1px solid var(--think-border,var(--border));border-radius:var(--block-r,12px);background:var(--think-bg);overflow:hidden}
.think-hd{display:flex;align-items:center;gap:8px;padding:9px 13px;font-size:12px;color:var(--think-fg);cursor:pointer}
.think-hd .spark{color:var(--accent)}
.think-hd .chev{margin-left:auto;opacity:.5;font-size:10px}
.think-body{padding:0 13px 12px 13px;font-size:12.5px;line-height:1.7;color:var(--text-mute);border-top:1px solid var(--border)}
.think-body::first-line{color:var(--text-mute)}
.think-body{padding-top:11px}

/* tool calls */
.tools{display:flex;flex-direction:column;gap:var(--tool-gap,4px)}
.tool{
  display:flex;align-items:center;gap:9px;padding:8px 11px;font-size:12px;
  border-radius:var(--tool-r,9px);background:var(--tool-bg);border:1px solid var(--tool-border,transparent);
}
.tool .tg{width:15px;text-align:center;color:var(--ok)}
.tool.run .tg{color:var(--accent)}
.tool .tn{font-family:var(--font-mono);font-size:11.5px;color:var(--text-bright)}
.tool .td{color:var(--text-mute);font-size:11.5px}
.tool .tt{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;color:var(--text-mute);opacity:.8}
.spin{display:inline-block;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* node operation */
.nodeop{
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:9px 12px;
  border-radius:var(--block-r,12px);background:var(--op-bg);border:1px solid var(--op-border,var(--border));font-size:12px;
}
.op-badge{font-family:var(--font-mono);font-weight:600;font-size:11px;padding:2px 7px;border-radius:6px}
.op-badge.add{background:var(--ok-soft);color:var(--ok)}
.op-text{color:var(--text)}
.op-paths{color:var(--text-mute);font-family:var(--font-mono);font-size:10.5px;flex-basis:100%;opacity:.85}
.op-actions{margin-left:auto;display:flex;gap:6px}
.mini{font-size:11px;padding:4px 10px;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--text-dim);cursor:pointer}
.mini.keep{color:var(--ok);border-color:var(--ok-line,var(--border))}
.mini.undo{color:var(--text-mute)}

/* code block */
.code{border:1px solid var(--code-border,var(--border));border-radius:var(--block-r,12px);overflow:hidden;background:var(--code-bg)}
.code-hd{display:flex;align-items:center;padding:7px 12px;background:var(--code-hd-bg,transparent);border-bottom:1px solid var(--border)}
.code-hd .lang{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.code-actions{margin-left:auto;display:flex;gap:6px}
.code-actions button{font-size:11px;padding:3px 9px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text-dim);cursor:pointer}
.code-actions .green{color:var(--ok);border-color:var(--ok-line,var(--border))}
.code pre{padding:12px 13px;overflow-x:auto;font-family:var(--font-mono);font-size:11.5px;line-height:1.75}
.code code{font-family:var(--font-mono)}
.com{color:var(--t-com)}.kw{color:var(--t-kw)}.fn{color:var(--t-fn)}
.attr{color:var(--t-attr)}.num{color:var(--t-num)}.str{color:var(--t-str)}

/* prose */
.prose{font-size:13.5px;line-height:1.72;color:var(--text)}
.prose b{color:var(--text-bright);font-weight:600}
.prose code{font-family:var(--font-mono);font-size:12px;background:var(--surface);padding:1px 6px;border-radius:5px;color:var(--accent)}

/* plan card */
.plan{border:1px solid var(--plan-border,var(--border));border-radius:var(--block-r,14px);background:var(--plan-bg);overflow:hidden}
.plan-hd{display:flex;align-items:center;gap:9px;padding:11px 14px;border-bottom:1px solid var(--border)}
.plan-ico{color:var(--accent)}
.plan-title{font-family:var(--font-display);font-weight:600;font-size:13px;color:var(--text-bright)}
.plan-badge{margin-left:auto;font-size:10.5px;font-family:var(--font-mono);color:var(--text-mute);border:1px solid var(--border);padding:2px 8px;border-radius:100px}
.plan-steps{padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.pstep{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:12.5px;color:var(--text-dim)}
.pstep .ps-n{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-family:var(--font-mono);border:1px solid var(--border);color:var(--text-mute)}
.pstep.done{color:var(--text)}
.pstep.done .ps-n{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pstep.active{color:var(--text-bright)}
.pstep.active .ps-n{background:var(--accent-soft);color:var(--accent);border-color:transparent;box-shadow:0 0 0 3px var(--accent-soft)}
.dag{display:flex;align-items:center;gap:0;padding:6px 14px 14px;flex-wrap:wrap;row-gap:8px}
.dnode{font-family:var(--font-mono);font-size:10.5px;padding:5px 9px;border-radius:7px;background:var(--surface);border:1px solid var(--border);color:var(--text-dim)}
.dnode.hot{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.dnode.ghost{opacity:.45;border-style:dashed}
.dedge{width:16px;height:1px;background:var(--border);position:relative}
.dedge::after{content:"";position:absolute;right:0;top:-2px;border-left:4px solid var(--border);border-top:2.5px solid transparent;border-bottom:2.5px solid transparent}

/* composer */
.composer{border-top:1px solid var(--border);padding:12px 14px;background:var(--composer-bg,transparent);display:flex;flex-direction:column;gap:10px}
.modes{display:inline-flex;gap:2px;padding:3px;background:var(--seg-bg);border-radius:var(--seg-r,10px);width:fit-content;border:1px solid var(--seg-border,transparent)}
.mode{padding:5px 15px;border-radius:calc(var(--seg-r,10px) - 3px);font-size:12px;border:none;background:transparent;color:var(--text-dim);cursor:pointer;transition:.2s;font-family:var(--font-body)}
.mode.active{background:var(--seg-active);color:var(--seg-active-fg);box-shadow:var(--seg-shadow,none)}
.input{display:flex;align-items:center;gap:9px;padding:8px 9px 8px 12px;border-radius:var(--input-r,14px);background:var(--input-bg);border:1px solid var(--input-border,var(--border))}
.input .attach{width:26px;height:26px;border-radius:8px;border:none;background:var(--surface);color:var(--text-dim);cursor:pointer;font-size:14px}
.input .field{flex:1;color:var(--text-mute);font-size:13px}
.input .send{width:32px;height:32px;border-radius:10px;border:none;background:var(--accent);color:var(--send-fg,#fff);cursor:pointer;font-size:15px;display:grid;place-items:center;box-shadow:var(--send-shadow,none)}
.meta{display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--text-mute);font-family:var(--font-mono)}
.meta .dotsep{opacity:.4}
.meta .cost{color:var(--ok)}

/* ============================================================
   THEME 01 — AURORA GLASS  (deep space, glass, aurora accent)
   ============================================================ */
[data-theme="aurora"]{
  --font-display:"Sora";--font-body:"Sora","Noto Sans SC";--font-mono:"JetBrains Mono";
  --bg:radial-gradient(120% 80% at 80% -10%,#1a1430 0%,#0c0c18 55%,#08080f 100%);
  --text:#cdd0dd;--text-bright:#fff;--text-dim:#9a9db0;--text-mute:#717488;
  --border:rgba(255,255,255,.08);--surface:rgba(255,255,255,.045);
  --accent:#9d7bff;--accent-soft:rgba(157,123,255,.16);--accent-line:rgba(157,123,255,.4);
  --ok:#5ad1a6;--ok-soft:rgba(90,209,166,.15);--err:#ff6b7d;
  --rail:linear-gradient(180deg,#9d7bff,#5ad1a6);
  --user-bg:rgba(255,255,255,.07);--user-fg:#e9eaf2;--user-border:rgba(255,255,255,.1);
  --think-bg:rgba(157,123,255,.06);--think-fg:#b7a6e8;
  --tool-bg:rgba(255,255,255,.04);
  --op-bg:rgba(90,209,166,.06);
  --code-bg:#0a0a14;--code-hd-bg:rgba(255,255,255,.03);
  --plan-bg:rgba(255,255,255,.03);
  --seg-bg:rgba(255,255,255,.05);--seg-active:rgba(157,123,255,.9);--seg-active-fg:#fff;
  --input-bg:rgba(255,255,255,.04);--input-r:16px;
  --t-com:#5a6a7a;--t-kw:#9d7bff;--t-fn:#5ad1a6;--t-attr:#ffb86b;--t-num:#7ec8ff;--t-str:#ff9eb5;
}
[data-theme="aurora"] .panel::before{content:"";position:absolute;top:-30%;left:-20%;width:80%;height:60%;background:radial-gradient(circle,rgba(157,123,255,.25),transparent 70%);filter:blur(50px);pointer-events:none}
[data-theme="aurora"] .hd{backdrop-filter:blur(20px)}

/* ============================================================
   THEME 02 — PURE LIGHT  (Apple light, hairline, calm)
   ============================================================ */
[data-theme="light"]{
  --font-display:"Manrope";--font-body:"Manrope","Noto Sans SC";--font-mono:"JetBrains Mono";
  --bg:#fbfbfd;--text:#1d1d1f;--text-bright:#000;--text-dim:#6e6e73;--text-mute:#86868b;
  --border:rgba(0,0,0,.09);--surface:rgba(0,0,0,.04);
  --accent:#0071e3;--accent-soft:rgba(0,113,227,.1);--accent-line:rgba(0,113,227,.25);
  --ok:#1d9d5b;--ok-soft:rgba(29,157,91,.12);--err:#e0314b;
  --rail:#0071e3;--rail-op:.5;
  --user-bg:#0071e3;--user-fg:#fff;--user-border:transparent;
  --think-bg:#f5f5f7;--think-fg:#6e6e73;
  --tool-bg:#f5f5f7;
  --op-bg:#f1faf4;
  --code-bg:#1d1d1f;--code-hd-bg:#fafafc;--code-border:rgba(0,0,0,.08);
  --text-on-code:#e6e6ea;
  --plan-bg:#fff;--plan-border:rgba(0,0,0,.08);
  --seg-bg:#ededf0;--seg-active:#fff;--seg-active-fg:#1d1d1f;--seg-shadow:0 1px 3px rgba(0,0,0,.12);
  --input-bg:#fff;--input-border:rgba(0,0,0,.12);--input-r:18px;
  --scroll:rgba(0,0,0,.18);
  --t-com:#a0a0a8;--t-kw:#9b6bff;--t-fn:#0071e3;--t-attr:#d97706;--t-num:#0a9396;--t-str:#c2410c;
}
[data-theme="light"] .code pre{color:#e6e6ea}
[data-theme="light"] .code-hd .lang{color:#86868b}
[data-theme="light"] .frame{box-shadow:0 50px 110px -30px rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.06)}

/* ============================================================
   THEME 03 — MONO EDITORIAL  (magazine, serif, near b/w)
   ============================================================ */
[data-theme="editorial"]{
  --font-display:"Fraunces";--font-body:"Newsreader","Noto Serif SC";--font-mono:"Space Mono";
  --bg:#0d0d0d;--text:#d8d6d0;--text-bright:#fafafa;--text-dim:#9a978f;--text-mute:#6b6862;
  --border:rgba(255,255,255,.12);--surface:rgba(255,255,255,.04);
  --accent:#e8e2d4;--accent-soft:rgba(232,226,212,.1);--accent-line:rgba(232,226,212,.3);--pop:#161616;
  --ok:#b8c5a0;--ok-soft:rgba(184,197,160,.12);--err:#d99;--warn:#d4a373;--warn-soft:rgba(212,163,115,.1);
  --rail:#e8e2d4;--rail-op:.6;
  --user-bg:transparent;--user-fg:#fafafa;--user-border:rgba(255,255,255,.2);--user-r:2px;
  --think-bg:transparent;--think-fg:#9a978f;--think-border:rgba(255,255,255,.12);
  --tool-bg:transparent;--tool-border:rgba(255,255,255,.1);--tool-r:0;
  --op-bg:transparent;--op-border:rgba(255,255,255,.12);
  --code-bg:#080808;--code-border:rgba(255,255,255,.12);--block-r:0;--chip-r:2px;--input-r:2px;--seg-r:2px;
  --plan-bg:transparent;

/* ============================================================
   INTERACTIVE STATES  (rich panels: themes 03/04/05/06/07/11)
   ============================================================ */
.field[contenteditable]{outline:none;max-height:90px;overflow-y:auto}
.field[contenteditable]:empty::before{content:attr(data-ph);color:var(--text-mute)}
.think .think-hd,.exec-hd,.pstep,.tool{user-select:none}
.think .chev,.exec-hd .chev{transition:transform .25s}
.think.collapsed .chev,.exec.collapsed .chev{transform:rotate(-90deg)}
.think.collapsed .think-body{display:none}
.tool{cursor:pointer}
.tool:hover{filter:brightness(1.06)}
.tool-detail{display:none;white-space:pre-line;font-family:var(--font-mono);font-size:10.8px;line-height:1.65;
  color:var(--text-mute);padding:9px 11px;margin-top:3px;border-radius:var(--tool-r,9px);
  background:var(--surface);border:1px solid var(--border)}
.tool.open + .tool-detail{display:block;animation:slideIn .2s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.exec-hd{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text-dim);cursor:pointer;padding:1px 2px}
.exec-hd .spark{color:var(--accent)}
.exec.collapsed .tools,.exec.collapsed .tool-detail{display:none}
.tools{margin-top:6px}

/* dropdown menus */
.dd{position:relative;display:inline-flex}
.dd .menu{position:absolute;top:calc(100% + 7px);left:0}
.dd.right .menu{left:auto;right:0}
.menu{z-index:40;min-width:158px;padding:6px;border-radius:13px;background:var(--pop,#1a1a1a);
  border:1px solid var(--border);box-shadow:0 22px 60px -18px rgba(0,0,0,.75);display:none;flex-direction:column;gap:1px}
.menu.show{display:flex;animation:menuIn .15s ease}
@keyframes menuIn{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
.menu button{text-align:left;background:none;border:none;color:var(--text);font-family:var(--font-body);
  font-size:12.5px;padding:8px 10px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:9px;white-space:nowrap}
.menu button:hover{background:var(--surface);color:var(--text-bright)}
.menu button.sel{color:var(--accent)}
.menu button .ck{margin-left:auto;color:var(--accent);font-size:12px;visibility:hidden}
.menu button.sel .ck{visibility:visible}
.menu button.sel{color:var(--accent)}
.menu .sep{height:1px;background:var(--border);margin:5px 3px}
.menu .mh{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-mute);padding:5px 10px 3px}

/* node-op resolved tags */
.op-actions .res-tag{font-size:11.5px;font-family:var(--font-mono)}
.op-actions .res-tag.kept{color:var(--ok)}
.op-actions .res-tag.reverted{color:var(--text-mute)}

/* plan interactions */
.plan-actions{display:flex;gap:8px;padding:2px 14px 14px}
.plan-btn{flex:1;padding:8px 0;border-radius:10px;font-size:12.5px;cursor:pointer;
  border:1px solid var(--border);background:transparent;color:var(--text);font-family:var(--font-body);transition:.18s}
.plan-btn:hover{border-color:var(--accent)}
.plan-btn.confirm{background:var(--accent);color:var(--send-fg,#fff);border-color:transparent}
.plan-btn.confirm:hover{filter:brightness(1.1);border-color:transparent}
.pstep{cursor:pointer}
.pstep-detail{display:none;font-size:11.2px;color:var(--text-mute);padding:0 0 7px 32px;line-height:1.6;font-family:var(--font-mono)}
.pstep.open + .pstep-detail{display:block;animation:slideIn .2s ease}

/* misc live */
.ctx-refresh{cursor:pointer}
.ctx-refresh.spin{animation:sp .6s linear}
.flash-ok{color:var(--ok)!important;border-color:var(--ok-line,var(--ok))!important}
.caret{display:inline-block;width:6px;height:1em;background:var(--accent);margin-left:1px;
  vertical-align:-2px;animation:bl 1s steps(1) infinite;border-radius:1px}
@keyframes bl{50%{opacity:0}}
.gen-row{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--text-dim);padding:3px 0}
.gen-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:gp 1s ease-in-out infinite}
@keyframes gp{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
.fade-in{animation:fadeIn .35s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.toggle,.mode,.chip,.icon-btn,.send,.mini,.code-actions button{transition:.18s}
.send:active{transform:scale(.92)}

/* caption LIVE badge */
.cap .live{display:inline-flex;align-items:center;gap:6px;margin-left:12px;font-size:10px;letter-spacing:.12em;
  color:#4ade80;border:1px solid rgba(74,222,128,.45);border-radius:100px;padding:3px 10px;vertical-align:middle;font-family:"JetBrains Mono",monospace}
.cap .live::before{content:"";width:6px;height:6px;border-radius:50%;background:#4ade80;animation:gp 1.4s ease-in-out infinite}
.cap .hint{margin-top:18px;font-size:11.5px;color:var(--shell-fg);line-height:1.6;border-top:1px solid var(--shell-line);padding-top:14px}
.cap .hint b{color:#cfcfd6;font-weight:500}
.cap .notes{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.cap .notes li{position:relative;padding-left:16px;font-size:12px;line-height:1.55;color:#9a9aa6}
.cap .notes li::before{content:"";position:absolute;left:0;top:7px;width:5px;height:5px;border-radius:1px;background:#5a5a64}

/* session tabs bar */
.tabs{display:flex;align-items:center;gap:4px;padding:7px 12px;border-bottom:1px solid var(--border);
  background:var(--ctx-bg,transparent);overflow-x:auto}
.tabs::-webkit-scrollbar{height:0}
.tab{font-size:11.5px;padding:5px 11px;border-radius:var(--chip-r,8px);border:1px solid transparent;
  background:transparent;color:var(--text-dim);cursor:pointer;white-space:nowrap;transition:.18s;font-family:var(--font-body)}
.tab:hover{color:var(--text);background:var(--surface)}
.tab.active{color:var(--accent);background:var(--accent-soft);border-color:var(--accent-line,transparent)}
.tab-new{width:24px;height:24px;border-radius:var(--chip-r,8px);border:1px dashed var(--border);
  background:transparent;color:var(--text-mute);cursor:pointer;font-size:13px;flex-shrink:0;transition:.18s}
.tab-new:hover{color:var(--accent);border-color:var(--accent)}

/* tool warning state */
.tool.warn .tg{color:var(--warn,#d8a040)}
.tool.warn .tn{color:var(--text-bright)}
.tool.warn{background:var(--warn-soft,rgba(216,160,64,.08))}

  {id:"editorial",rich:true,en:"Mono Editorial",   zh:"黑白杂志",   phil:"杂志编排美学：衬线标题、方角、近黑白配色、左侧栏线。信息层级靠排版而非色彩——把每段对话当成排版作品。", tags:["Dark","Serif","Editorial"], sw:["#0d0d0d","#e8e2d4","#b8c5a0","#fafafa"], notes:["字体：Fraunces 衬线标题（斜体强调）+ Newsreader 正文","色彩：近黑底 / 米白文字 / 极少量米色点缀","结构：方角、发丝分隔线、左侧栏线、微型大写标签","动效：克制——仅淡入与展开，不抢戏"]},
  {id:"nordic",   rich:true,en:"Nordic Minimal",   zh:"北欧极简",   phil:"浅雾蓝灰、大量留白、柔和圆角。冷静、呼吸感、零噪音——长时间盯着也不累。", tags:["Light","Muted","Airy"], sw:["#f4f6f8","#5b7a99","#5a9678","#1a2330"], notes:["字体：Hanken Grotesk，轻量字重为主","色彩：雾蓝灰浅底 / 深蓝灰文字 / 低饱和强调","结构：大留白、柔和圆角、卡片极淡描边","动效：缓慢柔和，强调平静感"]},
  {id:"cobalt",   rich:true,en:"Glass Cobalt",     zh:"钴蓝玻璃",   phil:"钴蓝染色玻璃、深海蓝渐变、克制的青色点缀。沉稳、专业、有重量——最接近现有主题的进化路线。", tags:["Dark","Glass","Cobalt"], sw:["#0b1730","#4d8dff","#3fd6c0","#ffffff"], notes:["字体：Sora，几何无衬线，现代利落","色彩：深海蓝渐变 / 钴蓝主强调 / 青色次强调","结构：钴蓝染色玻璃面板、柔光晕、层次景深","动效：玻璃模糊 + 柔光，质感优先"]},
];

/* ---- wire interactions for a rich panel (scoped to its frame) ---- */
function wireRich(frame){
  const $=(s)=>frame.querySelector(s), $$=(s)=>[...frame.querySelectorAll(s)];
  const thread=$('.thread');
  const scrollBot=()=>{thread.scrollTop=thread.scrollHeight;};
  frame._timers=[];
  const after=(ms,fn)=>{const id=setTimeout(fn,ms);frame._timers.push(id);return id;};
  const clearTimers=()=>{frame._timers.forEach(clearTimeout);frame._timers=[];};
  const clip=(s,n)=>s.length>n?s.slice(0,n)+'…':s;

  // Web / Think toggles
  $$('.toggle[data-tg]').forEach(b=>b.onclick=()=>b.classList.toggle('on'));

  // session tabs
  function activateTab(tab){$$('.tab').forEach(x=>x.classList.remove('active'));tab.classList.add('active');}
  $$('.tab').forEach(tb=>tb.onclick=()=>activateTab(tb));
  let newTabN=0;
  const tabNew=$('.tab-new');
  if(tabNew)tabNew.onclick=()=>{
    const nb=document.createElement('button');nb.className='tab';nb.textContent='新对话 '+(++newTabN);
    nb.onclick=()=>activateTab(nb);
    tabNew.parentElement.insertBefore(nb,tabNew);activateTab(nb);
    clearTimers();
    thread.innerHTML='<div style="text-align:center;color:var(--text-mute);font-size:12px;padding:48px 0" class="fade-in">新会话 · 在下方输入消息开始</div>';
  };

  // collapsible think + exec (delegated so dynamic ones work too)
  frame.addEventListener('click',e=>{
    const th=e.target.closest('.think-hd'); if(th)th.parentElement.classList.toggle('collapsed');
    const ex=e.target.closest('.exec-hd'); if(ex)ex.parentElement.classList.toggle('collapsed');
    const tl=e.target.closest('.tool');    if(tl)tl.classList.toggle('open');
    const ps=e.target.closest('.pstep');   if(ps)ps.classList.toggle('open');
  });

  // dropdown menus
  $$('.dd').forEach(dd=>{
    const trigger=dd.querySelector('.chip,.icon-btn'), menu=dd.querySelector('.menu');
    trigger.addEventListener('click',ev=>{
      ev.stopPropagation();
      const open=menu.classList.contains('show');
      $$('.menu').forEach(m=>m.classList.remove('show'));
      if(!open)menu.classList.add('show');
    });
  });
  // provider / model selection
  function bindSelect(dd,onPick){
    const btn=$('.dd[data-dd="'+dd+'"] .chip'), items=$$('.dd[data-dd="'+dd+'"] .menu button');
    items.forEach(b=>b.onclick=()=>{
      items.forEach(x=>x.classList.remove('sel')); b.classList.add('sel');
      btn.firstChild.nodeValue=b.dataset.val+' ';
      onPick&&onPick(b.dataset.val);
    });
  }
  bindSelect('provider');
  bindSelect('model',(v)=>{const m=$('.m-model'); if(m)m.textContent=v;});
  // overflow actions
  $$('.dd[data-dd="more"] .menu button').forEach(b=>{
    b.onclick=()=>{
      const act=b.dataset.act;
      if(act==='clear'){clearTimers();thread.innerHTML='<div style="text-align:center;color:var(--text-mute);font-size:12px;padding:48px 0" class="fade-in">对话已清空 · 在下方输入消息开始新对话</div>';}
      else if(act==='memory'||act==='cook'){b.classList.toggle('sel');}
      else if(act==='flash'){b.classList.add('flash-ok');after(900,()=>b.classList.remove('flash-ok'));}
    };
  });

  // node-op Keep / Undo
  $$('.nodeop .mini').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const act=b.closest('.op-actions'), kept=b.classList.contains('keep');
    act.innerHTML='<span class="res-tag '+(kept?'kept':'reverted')+'">'+(kept?'✓ Kept':'↩ Reverted')+'</span>';
  });

  // code copy / add-wrangle
  $$('.code-actions button').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const o=b.textContent, green=b.classList.contains('green');
    b.textContent=green?'✓ Added':'✓ Copied'; b.classList.add('flash-ok');
    after(1200,()=>{b.textContent=o;b.classList.remove('flash-ok');});
  });

  // ctx refresh
  const rf=$('.ctx-refresh');
  if(rf)rf.onclick=()=>{rf.classList.add('spin');after(600,()=>rf.classList.remove('spin'));
    $('.ctx-sel').textContent=(1+Math.floor(Math.random()*4))+' nodes selected';};

  // mode switch (changes placeholder)
  $$('.mode').forEach(m=>m.onclick=()=>{
    $$('.mode').forEach(x=>x.classList.remove('active')); m.classList.add('active');
    const f=$('.field'), mo=m.dataset.mode;
    f.dataset.ph = mo==='Ask'?'问一个关于场景的问题…  (只读模式)'
                 : mo==='Plan'?'描述目标，先生成可确认的执行计划…'
                 : '描述你想在场景里做的事…  (Enter 发送)';
  });

  // plan confirm / reject
  const pa=$('.plan-actions');
  if(pa){
    pa.querySelector('.confirm').onclick=()=>{
      pa.innerHTML='<span class="res-tag kept" style="padding:8px 0;font-size:12.5px">✓ 计划已确认 · 开始执行</span>';
      const steps=$$('.pstep'); let idx=steps.findIndex(s=>s.classList.contains('active'));
      (function adv(){
        if(idx<0||idx>=steps.length)return;
        steps[idx].classList.remove('active'); steps[idx].classList.add('done');
        idx++;
        if(idx<steps.length){steps[idx].classList.add('active'); after(700,adv);}
      })();
    };
    pa.querySelector('.reject').onclick=()=>{
      pa.innerHTML='<span class="res-tag reverted" style="padding:8px 0;font-size:12.5px">✕ 计划已驳回</span>';
    };
  }

  // typewriter
  function typewrite(el,text,speed,done){
    el.textContent=''; const caret=document.createElement('span'); caret.className='caret'; el.appendChild(caret);
    let i=0;(function step(){
      if(i<text.length){caret.insertAdjacentText('beforebegin',text.charAt(i));i++;scrollBot();after(speed,step);}
      else{caret.remove();done&&done();}
    })();
  }

  // send → simulated streaming reply
  const field=$('.field'), sendBtn=$('.send');
  function appendUser(txt){
    const d=document.createElement('div'); d.className='msg user fade-in';
    d.innerHTML='<div class="bubble"></div>'; d.querySelector('.bubble').textContent=txt;
    thread.appendChild(d); scrollBot();
  }
  function simulateReply(txt){
    const msg=document.createElement('div'); msg.className='msg ai fade-in';
    msg.innerHTML='<div class="rail"></div><div class="ai-body"><div class="gen-row"><span class="gen-dot"></span>Thinking…</div></div>';
    thread.appendChild(msg); scrollBot();
    const body=msg.querySelector('.ai-body');
    after(650,()=>{
      body.innerHTML='';
      const think=document.createElement('div'); think.className='think fade-in';
      think.innerHTML='<div class="think-hd"><span class="spark">✦</span> Thought for 2.1s<span class="chev">▾</span></div><div class="think-body"></div>';
      body.appendChild(think); scrollBot();
      typewrite(think.querySelector('.think-body'),'分析请求："'+clip(txt,24)+'"。先用只读工具确认当前网络，再决定新建还是修改节点；所有改动包进 undo 分组保证可回退。',16,()=>{
        const exec=document.createElement('div'); exec.className='exec fade-in';
        exec.innerHTML='<div class="exec-hd"><span class="spark">◆</span> <span class="ex-label">Executing…</span><span class="chev">▾</span></div><div class="tools"></div>';
        body.appendChild(exec); scrollBot();
        const tools=exec.querySelector('.tools');
        const seq=[['get_network_structure','/obj/geo1','0.2s'],['create_node','noise2','0.3s'],['set_parameter','amp = 1.8','0.2s']];
        let k=0;(function addTool(){
          if(k>=seq.length){exec.querySelector('.ex-label').textContent='Completed · '+seq.length+' tools · 0.7s'; after(300,streamProse); return;}
          const a=seq[k++]; const row=document.createElement('div'); row.className='tool ok fade-in';
          row.innerHTML='<span class="tg">✓</span><span class="tn"></span><span class="td"></span><span class="tt">'+a[2]+'</span>';
          row.querySelector('.tn').textContent=a[0]; row.querySelector('.td').textContent=a[1];
          tools.appendChild(row); scrollBot(); after(340,addTool);
        })();
        function streamProse(){
          const p=document.createElement('p'); p.className='prose fade-in'; body.appendChild(p);
          typewrite(p,'已按你的描述更新网络：新增 noise 节点并设好参数。需要我继续细化或可视化结果吗？',18,scrollBot);
        }
      });
    });
  }
  function send(){const txt=(field.textContent||'').trim(); if(!txt)return; field.textContent=''; appendUser(txt); simulateReply(txt);}
  sendBtn.onclick=send;
  field.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
}

const stage = document.getElementById('stage');
THEMES.forEach((t,i)=>{
  const page=document.createElement('div');
  page.className='page';page.dataset.idx=i;
  page.innerHTML=`
    <div class="cap">
      <div class="pgno"><b>${String(i+1).padStart(2,'0')}</b> / ${String(THEMES.length).padStart(2,'0')}</div>
      <h2>${t.en}${t.rich?'<span class="live">LIVE</span>':''}</h2>
      <div class="zh">${t.zh}</div>
      <div class="phil">${t.phil}</div>
      <div class="tags">${t.tags.map(x=>`<span class="tag">${x}</span>`).join('')}</div>
      <div class="sw">${t.sw.map(c=>`<i style="background:${c}"></i>`).join('')}</div>
      ${t.notes?'<ul class="notes">'+t.notes.map(n=>'<li>'+n+'</li>').join('')+'</ul>':''}
      ${t.rich?'<div class="hint"><b>可交互：</b>点开思考块 / 工具行 / 计划步骤；切 Provider·Model·模式；Keep·Undo；确认计划；<b>在输入框打字并按 Enter</b> 看模拟流式回复。</div>':''}
    </div>
    <div class="frame" data-theme="${t.id}">${t.rich?RICH_PANEL:PANEL}</div>`;
  stage.appendChild(page);
  if(t.rich)wireRich(page.querySelector('.frame'));
});
// close any open dropdown when clicking elsewhere
document.addEventListener('click',()=>document.querySelectorAll('.menu.show').forEach(m=>m.classList.remove('show')));

const dotsWrap=document.getElementById('dots');
THEMES.forEach((t,i)=>{
  const d=document.createElement('button');
  d.className='dot';d.textContent=String(i+1).padStart(2,'0');d.dataset.idx=i;
  d.onclick=()=>go(i);dotsWrap.appendChild(d);
});

let cur=0;const pages=[...document.querySelectorAll('.page')];const dots=[...document.querySelectorAll('.dot')];
const navName=document.getElementById('navName');const cTop=document.getElementById('cTop');
function go(i){
  cur=(i+THEMES.length)%THEMES.length;
  pages.forEach((p,k)=>p.classList.toggle('active',k===cur));
  dots.forEach((d,k)=>d.classList.toggle('on',k===cur));
  navName.innerHTML=`<b>${THEMES[cur].en}</b> · ${THEMES[cur].zh}`;
  cTop.textContent=String(cur+1).padStart(2,'0');
  // restart caption/frame animation
  const ac=pages[cur].querySelector('.cap'),af=pages[cur].querySelector('.frame');
  [ac,af].forEach(el=>{el.style.animation='none';void el.offsetWidth;el.style.animation='';});
}
document.getElementById('prev').onclick=()=>go(cur-1);
document.getElementById('next').onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')go(cur-1);
  if(e.key==='ArrowRight')go(cur+1);
  if(/^[1-9]$/.test(e.key))go(parseInt(e.key)-1);
});
go(0);
</script>
