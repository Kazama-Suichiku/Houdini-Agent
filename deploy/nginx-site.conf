# ============================================================
# Houdini Agent 主页 — Nginx 站点配置
# 适用：Tencent 轻量应用服务器 · Ubuntu 22.04 / 24.04
# 把所有 houdini-agent.com 替换成你的真实域名（server-setup.sh 会自动替换）
# 证书放在 /etc/nginx/ssl/houdini-agent.com.crt 和 .key
# ============================================================

# ---- HTTP：全部 301 跳转到 HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name houdini-agent.com www.houdini-agent.com;
    return 301 https://$host$request_uri;
}

# ---- HTTPS 主站 ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name houdini-agent.com www.houdini-agent.com;

    # 腾讯云下载的 Nginx 证书（.crt 为完整链 fullchain）
    ssl_certificate     /etc/nginx/ssl/houdini-agent.com.crt;
    ssl_certificate_key /etc/nginx/ssl/houdini-agent.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root  /var/www/houdini-agent;
    index index.html;

    # 安全响应头
    add_header X-Content-Type-Options nosniff           always;
    add_header X-Frame-Options        SAMEORIGIN         always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;
    # 确认 HTTPS 稳定后再开启 HSTS（开启后浏览器会强制半年内只走 HTTPS）：
    # add_header Strict-Transport-Security "max-age=15552000" always;

    # gzip 压缩
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # 静态资源长缓存
    location ~* \.(?:css|js|png|jpe?g|gif|webp|svg|woff2?|ttf|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # 安装包下载（独立目录，发布网页时不会被清空；强制下载而非在浏览器打开）
    location /download/ {
        alias /var/www/ha-downloads/;
        add_header Content-Disposition "attachment";
        autoindex off;
    }

    # 页面
    location / {
        try_files $uri $uri/ =404;
    }

    # ---- /api 反代到本地后端（埋点接收服务 ha-telemetry，监听 127.0.0.1:8000）----
    location /api/ {
        proxy_pass http://127.0.0.1:8000;          # 后端监听的本地端口
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
